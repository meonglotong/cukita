# scripts/nginx-teamdocs.conf → /etc/nginx/conf.d/teamdocs.conf
# Plain HTTP on public port 3001 (parity with Grafana's own TLS on 3000:
# TLS is not terminated here).
# ADAPTATION: the brief proxied 3001 -> 127.0.0.1:3001 (self-proxy). The app
# listens on internal port 3100 instead, so this block proxies to 3100.
server {
    listen 3001;
    server_name _;
    client_max_body_size 110m;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        # Next 15.3.x Server Actions validate the browser's Origin header
        # against the forwarded host — a port-less Host behind a proxy on
        # :3001 → "Invalid Server Actions request" (login POST 500s).
        # Forward host WITH the public port so it matches the Origin.
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
