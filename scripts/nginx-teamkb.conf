# scripts/nginx-teamkb.conf → /etc/nginx/conf.d/teamkb.conf
# Plain HTTP on public port 3002 (parity with teamdocs on 3001: no TLS here).
server {
    listen 3002;
    server_name _;
    client_max_body_size 10m; # image uploads (max 10MB, see src/lib/files.ts)
    location / {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        # Next 15.3.x Server Actions validate the browser's Origin header
        # against the forwarded host — a port-less Host behind a proxy on
        # :3002 → "Invalid Server Actions request" (login POST 500s).
        # Forward host WITH the public port so it matches the Origin.
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
